[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vilivyopoteanakupatikana-ai"
version = "0.1.0"
description = "Internal local EmbeddingGemma matching-suggestion service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pillow>=10,<13",
  "sentence-transformers>=6.1,<7.0",
  "transformers>=5.18,<6.0",
  "torchvision>=0.19,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["main", "embeddinggemma"]
