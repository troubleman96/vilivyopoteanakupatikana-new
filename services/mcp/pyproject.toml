[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vilivyopotea-mcp"
version = "0.1.0"
description = "Read-only FastMCP adapter for public lost-and-found discovery"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1.0,<5.0.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
