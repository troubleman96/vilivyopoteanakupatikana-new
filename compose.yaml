services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vilivyopotea}
      POSTGRES_USER: ${POSTGRES_USER:-vilivyopotea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private

  ai:
    build:
      context: ./services/ai
    environment:
      PORT: "8090"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_SERVICE_TOKEN_REQUIRED: ${AI_SERVICE_TOKEN_REQUIRED:-false}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  mcp:
    profiles: ["mcp"]
    build:
      context: ./services/mcp
    environment:
      VILIVY_API_BASE_URL: http://api:8080/api/v1
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8100"
    depends_on:
      api:
        condition: service_started
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./services/api
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vilivyopotea}:${POSTGRES_PASSWORD:-}@database:5432/${POSTGRES_DB:-vilivyopotea}?sslmode=disable
      APP_DATABASE_USER: ${POSTGRES_APP_USER:-vilivyopotea_app}
      APP_DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private
    restart: "no"

  api:
    build:
      context: ./services/api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-vilivyopotea_app}:${POSTGRES_APP_PASSWORD:-}@database:5432/${POSTGRES_DB:-vilivyopotea}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3003,http://localhost:3004}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      AI_SERVICE_URL: http://ai:8090
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_MATCHING_ENABLED: ${AI_MATCHING_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_started
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"
    networks:
      - app
      - private
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-http://localhost:3001}
        NEXT_PUBLIC_INSTITUTION_APP_URL: ${NEXT_PUBLIC_INSTITUTION_APP_URL:-http://localhost:3004}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3003}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_INSTITUTION_APP_URL: ${NEXT_PUBLIC_INSTITUTION_APP_URL:-http://localhost:3004}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3003}
    depends_on:
      - api
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    networks:
      - app
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
      args:
        NEXT_PUBLIC_PRODUCT_APP_URL: ${NEXT_PUBLIC_PRODUCT_APP_URL:-http://localhost:3000}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${LANDING_HOST_PORT:-3001}:3001"
    networks:
      - app
    restart: unless-stopped

  institution:
    build:
      context: .
      dockerfile: Dockerfile.institution
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_PRODUCT_APP_URL: ${NEXT_PUBLIC_PRODUCT_APP_URL:-http://localhost:3000}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${INSTITUTION_HOST_PORT:-3004}:3002"
    networks:
      - app
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_PRODUCT_APP_URL: ${NEXT_PUBLIC_PRODUCT_APP_URL:-http://localhost:3000}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HOST_PORT:-3003}:3003"
    networks:
      - app
    restart: unless-stopped

networks:
  app:
  private:
    internal: true

volumes:
  postgres-data:
