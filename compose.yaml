services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vilivyopotea}
      POSTGRES_USER: ${POSTGRES_USER:-vilivyopotea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private

  ai:
    build:
      context: ./services/ai
    environment:
      PORT: "8090"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./services/api
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vilivyopotea}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}@database:5432/${POSTGRES_DB:-vilivyopotea}?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private
    restart: "no"

  api:
    build:
      context: ./services/api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-vilivyopotea}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}@database:5432/${POSTGRES_DB:-vilivyopotea}?sslmode=disable
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_SERVICE_URL: http://ai:8090
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_MATCHING_ENABLED: ${AI_MATCHING_ENABLED:-false}
      DEMO_READS: "true"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_started
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    networks:
      - app
      - private
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks:
      - app
    restart: unless-stopped

networks:
  app:
  private:
    internal: true

volumes:
  postgres-data:
